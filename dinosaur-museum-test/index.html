<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>恐龍館｜低面數模型測試</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,'Noto Sans TC',sans-serif;color:#405256}body{background:linear-gradient(#c6d9dc,#e7e2d4)}canvas{width:100%;height:100%;display:block}header,footer,button{position:fixed;background:#fffE;border:0;border-radius:14px;padding:10px 14px;box-shadow:0 4px 18px #40565b22}header{top:12px;left:12px}h1{font-size:17px;margin:0 0 3px}p{font-size:12px;margin:0;color:#68777a}button{top:13px;right:12px;color:#405256;font-size:14px}footer{bottom:12px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px}.fallback{position:fixed;inset:0;display:grid;place-items:center}.fallback svg{width:min(90vw,78vh)}#stage{position:fixed;inset:0}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body><div class="fallback" id="fallback"><svg viewBox="0 0 600 520"><polygon points="300,10 550,145 550,375 300,510 50,375 50,145" fill="#91c875" stroke="#cdbd9f" stroke-width="18"/><rect x="215" y="90" width="170" height="90" rx="12" fill="#f1e2c4"/><polygon points="195,105 300,45 405,105" fill="#579e9b"/><text x="300" y="145" text-anchor="middle" font-size="24" fill="#355f62">恐龍館</text><g stroke="#4d7045" stroke-width="5"><ellipse cx="200" cy="300" rx="80" ry="48" fill="#79ad59"/><circle cx="270" cy="295" r="38" fill="#79ad59"/><path d="M260 270l-15-35m35 34 18-29" stroke="#f5e5c0" stroke-width="10"/><ellipse cx="410" cy="295" rx="55" ry="65" fill="#c96f52"/><ellipse cx="390" cy="225" rx="52" ry="35" fill="#d47b5b"/><path d="M358 238q38 25 68 0" fill="#fff4df"/><path d="M395 345v45m45-45v45" stroke="#b96349" stroke-width="18"/></g></svg></div><canvas id="stage"></canvas><header><h1>恐龍館｜低面數模型</h1><p>一格六角地・三角龍與暴龍戶外園區</p></header><button id="reset">重設視角</button><footer>拖曳旋轉・縮放・恐龍模型取自素材包並保留授權檔</footer><script type="module">
import * as THREE from 'three';import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const canvas=document.querySelector('#stage'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene();scene.background=new THREE.Color('#c6d9dc');const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.1,100);camera.position.set(10,9,12);const controls=new OrbitControls(camera,canvas);controls.target.set(0,1,0);controls.enableDamping=true;controls.maxPolarAngle=1.45;
scene.add(new THREE.HemisphereLight('#fff5df','#70896d',2.1));const sun=new THREE.DirectionalLight('#fff0d2',3);sun.position.set(-5,10,7);sun.castShadow=true;scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.85,flatShading:true});const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),mat('#c6d9dc'));floor.rotation.x=-Math.PI/2;floor.position.y=-.12;scene.add(floor);
const hex=new THREE.Mesh(new THREE.CylinderGeometry(4.0,4.0,.24,6,1),mat('#cdbd9f'));hex.rotation.y=Math.PI/6;hex.position.y=0;hex.receiveShadow=true;scene.add(hex);const grass=new THREE.Mesh(new THREE.CylinderGeometry(3.78,3.78,.09,6,1),mat('#91c875'));grass.rotation.y=Math.PI/6;grass.position.y=.16;grass.receiveShadow=true;scene.add(grass);
function box(w,h,d,c,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y+h/2,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
// 小型館舍
box(2.15,1.05,1.3,'#f1e2c4',0,.22,-2.15);const roof=new THREE.Mesh(new THREE.ConeGeometry(1.45,.58,4),mat('#579e9b'));roof.rotation.y=Math.PI/4;roof.position.set(0,1.63,-2.15);scene.add(roof);box(.48,.75,.07,'#795c47',0,.22,-1.48);
const road=box(.82,.025,4.3,'#e8dfcf',0,.18,.55);for(let i=0;i<5;i++)box(.55,.025,.42,i%2?'#eee6d9':'#ded3c0',0,.21,-.6+i*.58);
function fence(cx,cz,rx,rz){let arr=[];for(let i=0;i<9;i++){let a=i/8*Math.PI,x=cx+Math.cos(a)*rx,z=cz+Math.sin(a)*rz;box(.07,.32,.07,'#9b7048',x,.22,z);arr.push(new THREE.Vector3(x,.47,z))}for(let i=0;i<8;i+=2){const a=arr[i],b=arr[i+2],d=b.clone().sub(a),m=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,d.length(),6),mat('#e9d4a4'));m.position.copy(a.clone().add(b).multiplyScalar(.5));m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());scene.add(m)}}
function loadDino(file,x,z,scale,color){return new Promise((resolve,reject)=>new FBXLoader().load('models/'+file,obj=>{obj.scale.setScalar(scale);const b=new THREE.Box3().setFromObject(obj),center=b.getCenter(new THREE.Vector3()),size=b.getSize(new THREE.Vector3());obj.position.x-=center.x;obj.position.z-=center.z;obj.position.y+=.22-b.min.y;obj.position.x+=x;obj.position.z+=z;obj.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.material=new THREE.MeshStandardMaterial({color,roughness:.86,flatShading:true});o.geometry.computeVertexNormals()}});scene.add(obj);if(obj.animations?.length){const mixer=new THREE.AnimationMixer(obj);obj.animations.forEach(a=>mixer.clipAction(a).play());mixers.push(mixer)}resolve(obj)},undefined,reject))}
const mixers=[];Promise.all([loadDino('Triceratops.fbx',-1.15,.45,.008,'#80ad59'),loadDino('Trex.fbx',1.15,.45,.008,'#c87554')]).then(()=>{document.querySelector('#fallback').style.display='none'}).catch(e=>console.error(e));
for(const [x,z] of [[-2.65,-1.0],[2.62,-.95],[-2.55,1.75],[2.5,2.05]]){const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.07,.1,.5,6),mat('#a87952'));trunk.position.set(x,.48,z);scene.add(trunk);const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(.42,0),mat('#64a856'));crown.position.set(x,.92,z);crown.castShadow=true;scene.add(crown)}
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();document.querySelector('#reset').onclick=()=>{camera.position.set(10,9,12);controls.target.set(0,1,0)};const clock=new THREE.Clock();renderer.setAnimationLoop(()=>{const dt=clock.getDelta();mixers.forEach(m=>m.update(dt));controls.update();renderer.render(scene,camera)});
</script></body></html>
