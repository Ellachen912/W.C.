<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Winston City 棒球場</title><style>body{margin:0;background:#f5f0e7;font:16px system-ui;text-align:center}canvas{display:block;touch-action:none}header{padding:12px}button{padding:8px}</style><header><b>Winston City · 一格棒球場</b><p>拖曳旋轉・雙指縮放</p><button id="roof">切換屋頂</button></header><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script><script type="module">import * as T from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';const scene=new T.Scene();scene.background=new T.Color('#f5f0e7');const camera=new T.PerspectiveCamera(38,innerWidth/(innerHeight*.76),.1,100);camera.position.set(7,8,10);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight*.76);document.body.append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.y=.5;controls.enableDamping=true;scene.add(new T.HemisphereLight(0xffffff,0x958477,2));const sun=new T.DirectionalLight(0xffffff,3);sun.position.set(4,8,5);scene.add(sun);const root=new T.Group();scene.add(root);const mat=c=>new T.MeshStandardMaterial({color:c,roughness:.8});function mesh(g,c,x,y,z,p=root){const o=new T.Mesh(g,mat(c));o.position.set(x,y,z);p.add(o);return o}function box(w,h,d,c,x,y,z,p=root){return mesh(new T.BoxGeometry(w,h,d),c,x,y,z,p)}function cyl(r,h,c,x,y,z,n=32,p=root){return mesh(new T.CylinderGeometry(r,r,h,n),c,x,y,z,p)}function line(a,b,r,c,p=root){const v=new T.Vector3(...b).sub(new T.Vector3(...a));const o=mesh(new T.CylinderGeometry(r,r,v.length(),8),c,...a,p);o.position.addScaledVector(v,.5);o.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),v.normalize());return o}const tile=cyl(3.0,.22,'#c7a477',0,-.12,0,6);cyl(2.96,.04,'#83b75c',0,.01,0,6);cyl(2.17,.16,'#e7d6b9',0,.11,0);cyl(1.72,.035,'#76ad4b',0,.22,0);const clay=box(1.42,.025,1.42,'#c88b57',0,.25,.37);clay.rotation.y=Math.PI/4;const grass=box(.94,.028,.94,'#7cb64e',0,.267,.37);grass.rotation.y=Math.PI/4;for(const [x,z] of [[0,1.37],[1,.37],[0,-.63],[-1,.37]]){const b=box(.13,.035,.13,'#fffaf0',x,.29,z);b.rotation.y=Math.PI/4;}cyl(.16,.035,'#c88b57',0,.29,.37);box(.13,.025,.04,'#fffaf0',0,.32,.37);for(const sign of [-1,1])line([0,.29,1.37],[sign*1.42,.29,-.05],.012,'#ffffff');const roof=new T.Group();root.add(roof);for(let i=0;i<30;i++){const a=Math.PI*.18+i*Math.PI*1.64/29;const x=Math.sin(a),z=-Math.cos(a);for(let j=0;j<3;j++){const r=1.82+j*.13;const b=box(.20,.11,.16,j%2?'#5485ba':'#396b9f',x*r,.31+j*.13,z*r);b.rotation.y=-a;}const wall=box(.23,.65,.12,'#ead8b9',x*2.12,.48,z*2.12);wall.rotation.y=-a;if(i%3===0){line([x*2.12,.8,z*2.12],[x*2.12,1.12,z*2.12],.035,'#f8f1e5',roof);}const canopy=box(.25,.09,.38,'#5d96c9',x*2.02,1.12,z*2.02,roof);canopy.rotation.y=-a;}box(1.02,.62,.18,'#e8d5b8',0,.45,2.04);box(.58,.44,.03,'#78b9d4',0,.39,2.14);box(.83,.12,.32,'#477db3',0,.82,2.08);box(.7,.04,.53,'#d8c8ad',0,.05,2.44);const ball=mesh(new T.SphereGeometry(.19,24,16),'#fff9e9',0,1.04,2.13);for(const sign of [-1,1]){for(let i=0;i<7;i++){const y=(i-3)*.041;const x=sign*(.08+.035*Math.cos(i*.5));box(.026,.012,.014,'#b84d43',x,1.04+y,2.13+Math.sqrt(Math.max(0,.19*.19-x*x-y*y)));}line([sign*.36,.82,2.13],[-sign*.24,1.18,2.13],.055,'#c38d4b');}box(.83,.42,.12,'#294966',0,1.01,-2.04);box(.68,.28,.02,'#538bb2',0,1.01,-1.97);for(const x of [-1.62,1.62]){line([x,.15,-1.45],[x,1.85,-1.45],.045,'#65788c');box(.48,.28,.12,'#687e97',x,1.85,-1.45);for(let i=0;i<3;i++)for(let j=0;j<2;j++)mesh(new T.SphereGeometry(.055,12,8),'#fff4bf',x+(i-1)*.14,1.85+(j-.5)*.12,-1.37);}for(const x of [-1.42,1.42]){cyl(.065,.36,'#94643d',x,.22,1.78);mesh(new T.IcosahedronGeometry(.26,1),'#6ba34d',x,.53,1.78);}document.getElementById('roof').onclick=()=>roof.visible=!roof.visible;window.addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight*.76);camera.aspect=innerWidth/(innerHeight*.76);camera.updateProjectionMatrix()});renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});</script></html>
