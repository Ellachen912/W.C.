<canvas aria-label="雙六角動物園"></canvas>
<header><h1>溪谷動物園</h1><p id="status">載入園區中…</p></header>
<nav aria-label="觀景切換">
<button data-view="all">全園</button><button data-view="creek">象群近觀</button><button data-view="forest">草地近觀</button>

<div id="route-note" hidden>
<strong>短程往返，分批出發</strong>
<ul><li>大小象沿不同路線走，踩著弧線掉頭。</li><li>長頸鹿在傘冠樹前沿 U 形路線折返。</li><li>三隻鴕鳥在前草地各走一段，停下張望。</li><li>兩隻鹿輪流沿草坡上下走，沿弧線折返。</li></ul>
</div>
</nav>
