<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winston City｜市長與 Avery 動作測試</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5fa;color:#202c40;font:16px system-ui,sans-serif}
main{max-width:1080px;margin:auto;padding:20px}h1{font-size:1.65rem;margin:0 0 12px}
figure{margin:0;border:1px solid #cbd5e1;border-radius:16px;overflow:hidden;background:#e3ecf7}
canvas{display:block;width:100%;height:min(53vh,490px);touch-action:none}
figcaption{background:white;padding:8px 14px;text-align:center}
fieldset{margin:12px 0 0;border:1px solid #cbd5e1;border-radius:10px}
button{font:inherit;color:inherit;margin:3px;padding:8px 12px;border:1px solid #a7b5c9;border-radius:8px;background:white;cursor:pointer}
button[aria-pressed=true]{background:#203d70;color:white}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<main>
<h1>市長與 Avery｜動作與表情</h1>
<figure><canvas aria-label="市長和 Avery 的 3D 動作預覽"></canvas><figcaption id="status" aria-live="polite">載入中</figcaption></figure>
<fieldset id="motions"><legend>動作</legend></fieldset>
<fieldset id="faces"><legend>表情</legend></fieldset>
<p>拖曳旋轉 · 雙指或滾輪縮放</p>
</main>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { makeMayor } from './city-v1.3/vip_mayor.js';
import { makeAvery } from './city-v1.3/vip_avery.js';
const canvas=document.querySelector('canvas');
const status=document.querySelector('#status');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color('#e3ecf7');
scene.add(new THREE.HemisphereLight(0xffffff,0xc2adc4,2.1));
const sun=new THREE.DirectionalLight(0xfff2df,2);
sun.position.set(-1,3,4); scene.add(sun);
const stage=new THREE.Mesh(new THREE.CircleGeometry(1,64),new THREE.MeshStandardMaterial({color:'#c3d3e9'}));
stage.rotation.x=-Math.PI/2;stage.position.y=-.007;scene.add(stage);
const camera=new THREE.PerspectiveCamera(32,1,.02,20);
camera.position.set(.04,.50,1.53);
const controls=new OrbitControls(camera,canvas);
controls.target.set(0,.27,0);controls.minDistance=.34;controls.maxDistance=3;controls.maxPolarAngle=Math.PI*.49;
controls.enableDamping=true;controls.update();
const mayor=makeMayor(),avery=makeAvery();
mayor.obj.position.x=-.21;avery.obj.position.x=.21;
scene.add(mayor.obj,avery.obj);
const labels={idle:'站立',walk:'走路',wave:'揮手',clap:'拍手',handshake:'握手',proud:'叉腰',icecream:'拿冰淇淋',
 crouch:'蹲下',pray:'拜拜',waitdoor:'門口等',chat:'聊天',dance:'左右搖擺舞',
 sitIce:'坐下＋拿冰淇淋',sitChat:'坐下＋聊天',cover:'抬手靠近臉頰笑'};
const faces={auto:'依動作',normal:'原版',smile:'微笑',laugh:'開心大笑',calm:'閉眼'};
let motion='idle',expression='auto',time=0;
function buttons(id,options,choose){
 const parent=document.getElementById(id);
 for(const [key,name] of Object.entries(options)){
  const button=document.createElement('button');
  button.dataset.key=key;button.textContent=name;button.setAttribute('aria-pressed','false');
  button.onclick=()=>{choose(key);for(const child of parent.querySelectorAll('button'))child.setAttribute('aria-pressed',String(child===button));};
  parent.append(button);
 }
}
buttons('motions',labels,key=>{ motion=key;time=0; });
buttons('faces',faces,key=>{expression=key;});
document.querySelector('[data-key=idle]').click();
document.querySelector('[data-key=auto]').click();
function animate(dt){
 time+=dt;
 const sit=motion==='sitIce'||motion==='sitChat';
 const act=motion==='sitIce'?'icecream':motion==='sitChat'?'chat':motion;
 const cover=motion==='cover';
 const state={sit,walk:motion==='walk',ph:time*8,wave:motion==='wave',
   face:expression==='auto'?undefined:expression};
 const toward=motion==='chat'||motion==='sitChat'||motion==='handshake';
 mayor.obj.rotation.y=THREE.MathUtils.damp(mayor.obj.rotation.y,toward?.35:0,8,dt);
 avery.obj.rotation.y=THREE.MathUtils.damp(avery.obj.rotation.y,toward?-.35:0,8,dt);
 mayor.anim(dt,{...state,act,talk:act==='chat'&&time%4<2,
   look:avery.obj.position,cover,face:state.face??(cover?'laugh':undefined)});
 avery.anim(dt,{...state,act,talk:act==='chat'&&time%4>=2,look:mayor.obj.position,
   cover:motion==='cover',face:state.face??(motion==='cover'?'laugh':undefined)});
 status.textContent='市長　｜　Avery　 ·　'+labels[motion]+'　 ·　'+faces[expression];
}
function draw(){
 const width=canvas.clientWidth,height=canvas.clientHeight;
 if(camera.aspect!==width/height||canvas.width!==Math.floor(width*renderer.getPixelRatio())){
  renderer.setSize(width,height,false);camera.aspect=width/height;camera.updateProjectionMatrix();
 }
 controls.update();renderer.render(scene,camera);
}
let last=performance.now();
window.a2Preview={renderAt(seconds){
 renderer.setAnimationLoop(null);
 for(let i=0;i<Math.round(seconds*60);i++)animate(1/60);
 draw();
}};
renderer.setAnimationLoop(now=>{animate(Math.min(.05,(now-last)/1000));last=now;draw();});
</script>
</html>
