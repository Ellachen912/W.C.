<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow">
<title>Winston City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  /* 單一主題：晴天的海島 */
  --sky-top:#8fd3f5;
  --sky-low:#e3f6fd;
  --ink:#3b3550;
  --muted:#6d6785;
  --card:rgba(255,255,255,.92);
  --accent:#ff9f43;
  --font:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  /* 版面：整個畫面是 3D 小島；左上標題、右上確認事項、下方三種預覽按鈕、建地上方浮著名牌 */
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden}
body{background:linear-gradient(var(--sky-top),var(--sky-low) 65%);font-family:var(--font);color:var(--ink);-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(16px,env(safe-area-inset-bottom)) + 78px);color:var(--muted);font-size:15px;background:rgba(255,255,255,.75);padding:4px 12px;border-radius:999px;white-space:nowrap}
.tag:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#tags{position:fixed;inset:0;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;background:rgba(255,255,255,.94);border:0;border-radius:14px;padding:5px 12px 6px;font:inherit;font-size:16px;color:var(--ink);box-shadow:0 4px 10px rgba(59,53,80,.18);white-space:nowrap;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.tag small{font-size:13px;color:var(--muted)}
.tag.wip small{color:#c77700}
.tag.empty small{color:#3f9a4a}
.tag.later{font-size:14px;padding:3px 9px 4px;background:rgba(255,255,255,.86)}
.tag.later small{font-size:11px;color:#9a8f7a}
.tag::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-bottom:0;border-top-color:rgba(255,255,255,.94)}
.err{position:fixed;inset:auto 16px 50% 16px;text-align:center;font-size:18px;display:none}

/* ===== 小步 2：畫面配置 ===== */
.top{position:fixed;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.top>*{pointer-events:auto}
.city{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px;padding:8px 18px 8px 10px;box-shadow:0 6px 18px rgba(59,53,80,.12)}
.city{cursor:pointer}
.city .flag{width:55px;height:34px;border-radius:6px;box-shadow:0 2px 6px rgba(59,53,80,.25);flex:none}
.city b{font-size:22px;display:block;line-height:1.15}
.city span{font-size:16px;color:var(--muted)}
.stars{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:8px 22px 8px 14px;box-shadow:0 6px 18px rgba(59,53,80,.12);font-size:30px;font-weight:700;min-height:52px}
.stars{border:0;font-family:inherit;color:var(--ink);cursor:pointer}
.stars .jx{width:36px;height:36px}
.stars i{font-style:normal;color:var(--muted);font-size:30px;margin-left:2px}
.dock{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:10px;max-width:calc(100vw - 130px)}   /* 家長：兩顆靠左，右下角留給 Netlify 標籤 */
.big{font:inherit;font-size:18px;min-height:48px;min-width:0;padding:0 18px;border:0;border-radius:20px;background:var(--card);color:var(--ink);box-shadow:0 6px 18px rgba(59,53,80,.18);display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
.big.main{background:var(--accent);color:#fff}
.big svg{width:24px;height:24px}
.big:focus-visible,.sheet button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sheet{position:fixed;left:50%;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 66px);transform:translateX(-50%);width:min(380px,calc(100vw - 24px));max-height:min(46vh,calc(100vh - 150px));overflow:auto;background:rgba(255,255,255,.97);border-radius:20px;box-shadow:0 8px 26px rgba(59,53,80,.28);padding:12px 14px 14px;display:none;touch-action:pan-y;box-sizing:border-box}
.sheet.on{display:block}
.sheet.on~.hint{display:none}
.sheet h2{margin:0;font-size:20px;padding-right:44px}
.sheet .sub{color:var(--muted);font-size:14px;margin:1px 0 6px}
.sheet p{font-size:15px;line-height:1.45;margin:6px 0}
.sheet .fact{background:#eef8fd;border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.45}
.sheet .fact b{color:#2b86b8}
.sheet .x{position:absolute;top:8px;right:10px;width:38px;height:38px;border:0;border-radius:50%;background:#f1eef7;font:inherit;font-size:18px;color:var(--ink);cursor:pointer}
.sheet .go{font:inherit;font-size:18px;min-height:46px;width:100%;margin-top:8px;border:0;border-radius:16px;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.sheet .go:disabled{background:#d9d4e3;color:#7d7791;cursor:default}
.sheet .why{font-size:14px;color:#b25a00;text-align:center;margin-top:4px;min-height:18px}
.lvs{display:flex;gap:5px;margin:6px 0}
.lvs i{flex:1;height:8px;border-radius:4px;background:#e3dfee}
.lvs i.on{background:var(--accent)}
.row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:#f7f5fb;margin:6px 0;font-size:16px;min-height:44px}
.row.dim{opacity:.55}
.row.pick{outline:3px solid var(--accent)}
.row button:disabled{background:#d9d4e3;color:#7d7791}
.sheet p.now{background:#fff6e8;border-radius:12px;padding:6px 12px}
.pen{font:inherit;font-size:16px;width:34px;height:34px;border:0;border-radius:50%;background:#f1eef7;color:var(--ink);cursor:pointer;vertical-align:middle;margin-left:4px}
.sw{min-width:64px}.sw:not(.on){background:#d9d4e3!important;color:var(--ink)!important}
/* 注音：國字右邊直排注音，聲調在右邊、輕聲點在上面（和 tools/zhuyin.py 的圖卡一樣） */
.zy .c{display:inline-flex;align-items:center;vertical-align:middle;margin:0 .5px}
.zy .h{line-height:1}
.zy .z{display:flex;flex-direction:column;justify-content:center;font-size:.46em;line-height:1.02;margin-left:1px;min-height:2.2em;padding-right:1.45em;font-weight:400}
.zy .z i{font-style:normal;display:block;position:relative}
.zy .z .t{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;position:absolute;left:100%;top:-.05em;margin-left:-.08em;font-size:2.6em;font-weight:300;line-height:1;transform:scaleY(1.3);transform-origin:left center}   /* 家長 11-13：聲調放大、放在最後一個注音的右上方（課本寫法） */
.zy .z .l{display:block;width:.3em;height:.3em;border-radius:50%;background:currentColor;margin:0 auto .1em;font-size:1em;line-height:0;color:inherit;overflow:hidden;text-indent:-9em}   /* 輕聲點：放大、貼近注音上方 */
.sheet p .zy,.fact .zy,.lvd .zy{line-height:2.3}
.sheet p:has(.zy),.fact:has(.zy){font-size:16px}
.row b{flex:1;font-weight:600;line-height:1.3}
.row small{font-size:13px;color:var(--muted);font-weight:400}
.row button{font:inherit;font-size:16px;min-height:40px;padding:0 16px;border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer}
.row.go2{width:100%;border:0;font:inherit;font-size:16px;color:var(--ink);text-align:left;cursor:pointer;box-sizing:border-box}
.row.go2>i{font-style:normal;font-size:26px;color:var(--muted);padding-right:4px}   /* 只管右邊的箭頭；注音的 <i> 不能被放大（家長 11-13 注音變怪） */
.row .th{width:84px;height:84px;object-fit:contain;flex:none;margin:-4px 0}
.row.dim .th{filter:grayscale(.7);opacity:.6}
.sheet input{user-select:text;-webkit-user-select:text;font:inherit;font-size:16px;min-height:42px;width:100%;box-sizing:border-box;border:2px solid #d9d4e3;border-radius:12px;padding:0 12px;margin:4px 0;color:var(--ink)}
.back{font:inherit;font-size:14px;min-height:34px;border:0;border-radius:12px;background:#f1eef7;color:var(--ink);padding:0 12px;margin:0 0 4px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.cat{font:inherit;font-size:16px;min-height:50px;border:0;border-radius:14px;background:#fff2e2;color:var(--ink);padding:6px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:center;line-height:1.25}
.cat small{font-size:12px;color:var(--muted)}
.cat.dim{background:#f3f1f7;color:#9d98ad;cursor:default}
.pan{position:fixed;top:42%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.38);box-shadow:0 3px 12px rgba(59,53,80,.15);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;padding:0}   /* 家長 11-14：左右半透明箭頭，點一下城市往那邊滑一點 */
.pan svg{width:22px;height:22px;fill:none;stroke:rgba(59,53,80,.7);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
body:has(.sheet.on) .pan,body:has(.lvup) .pan{display:none}
#rotRing{position:fixed;z-index:30;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;border:4px solid rgba(255,255,255,.95);background:rgba(255,160,60,.35);color:#fff;font:800 40px/76px system-ui;text-align:center;pointer-events:none;opacity:0;transform:scale(.5);transition:opacity .15s,transform .15s;text-shadow:0 1px 3px rgba(0,0,0,.4)}#rotRing.on{opacity:1;transform:scale(1)}
.pan{display:none!important}   /* 家長 11-25 22:58：四個半透明箭頭不要了，改成點畫面移動 */
.pan:active{background:rgba(255,255,255,.65)}#panL{left:max(8px,env(safe-area-inset-left))}#panR{right:max(8px,env(safe-area-inset-right))}#panU,#panD{left:50%;transform:translateX(-50%)}#panU{top:calc(env(safe-area-inset-top) + 84px)}#panD{top:auto;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 66px)}
@media (min-width:700px) and (min-height:600px){.pan{width:50px;height:50px}.pan svg{width:28px;height:28px}#panU{top:calc(env(safe-area-inset-top) + 96px)}#panD{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 108px)}}   /* 手機小、iPad 大一點 */
.cat{position:relative}.cat b{font-weight:600}
.cat.can{background:#e3f6dc;box-shadow:inset 0 0 0 2.5px #5bb04f;padding-right:46px}   /* 家長 11-14：可以蓋的類別要凸顯：綠底綠框＋敲敲打打的小錘子 */
.ham{display:inline-block;width:34px;height:34px;flex:none}.ham svg{width:100%;height:100%;overflow:visible}
.ham .hm{transform-origin:16px 26px;animation:hamr 1s ease-in-out infinite}.ham .sp{opacity:0;animation:hams 1s ease-out infinite}
.row.can{background:#e3f6dc;box-shadow:inset 0 0 0 2.5px #5bb04f}.go .ham{width:30px;height:30px}.go .ham rect:nth-child(2){fill:#fff3c4}
@media (prefers-reduced-motion:reduce){.ham .hm,.ham .sp{animation:none}}
.cat .ham{position:absolute;top:4px;right:6px;width:36px;height:36px}.cat .ham svg{width:100%;height:100%;overflow:visible}
.cat .ham .hm{transform-origin:16px 26px;animation:hamr 1s ease-in-out infinite}.cat .ham .sp{opacity:0;animation:hams 1s ease-out infinite}
@keyframes hamr{0%,100%{transform:rotate(-38deg)}45%{transform:rotate(-38deg)}62%{transform:rotate(18deg)}72%{transform:rotate(8deg)}}
@keyframes hams{0%,58%{opacity:0;transform:scale(.4)}66%{opacity:1;transform:scale(1)}90%,100%{opacity:0;transform:scale(1.4)}}
@media (prefers-reduced-motion:reduce){.cat .ham .hm,.cat .ham .sp{animation:none}}
.city span .zy .z{font-size:.5em}.big .zy .z{font-size:.46em}.big{white-space:nowrap}.big svg{flex:none}.big .zy{white-space:nowrap}

.bign{font-size:30px;font-weight:700;text-align:center;margin:0 0 2px}
.pwd{display:flex;justify-content:center;gap:12px;margin:8px 0}
.pwd i{width:16px;height:16px;border-radius:50%;background:#e3dfee}
.pwd i.on{background:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:250px;margin:6px auto}
.pad button{font:inherit;font-size:20px;min-height:46px;border:0;border-radius:14px;background:#f1eef7;color:var(--ink);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.chips button{font:inherit;font-size:15px;min-height:38px;padding:0 13px;border:0;border-radius:19px;background:#eef8fd;color:var(--ink);cursor:pointer}
.chips button.on{background:var(--accent);color:#fff}
.amt{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0}
.amt button{font:inherit;font-size:24px;width:46px;height:46px;border:0;border-radius:50%;background:#f1eef7;color:var(--ink);cursor:pointer}
.amt b{font-size:30px;min-width:80px;text-align:center}
.sheet .go.alt{background:#f1eef7;color:var(--ink)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.confetti i{position:absolute;top:-16px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards;will-change:transform}
@keyframes fall{from{transform:translate3d(0,0,0) rotate(0)}to{transform:translate3d(40px,110vh,0) rotate(540deg)}}   /* 11-20：彩帶改用 transform 往下掉（原本改 top，手機每一格都要重新排版，慶祝畫面會卡） */
.jx{width:1em;height:1em;vertical-align:-.14em}
.sheet textarea{user-select:text;-webkit-user-select:text;width:100%;height:84px;box-sizing:border-box;font:inherit;font-size:13px;border:2px solid #d9d4e3;border-radius:12px;padding:8px;margin:6px 0;color:var(--ink);resize:none}
.lvup{position:fixed;inset:0;z-index:10;background:rgba(40,30,70,.5);display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box;animation:fadein .25s}
.lvbox{background:#fff;border-radius:26px;padding:18px 16px 16px;width:min(380px,100%);box-sizing:border-box;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35);animation:pop .55s cubic-bezier(.2,1.5,.4,1)}
.lvt{font-size:28px;font-weight:700;color:#e8741c;line-height:1.2}
.lvc{font-size:18px;color:#2b86b8;margin-top:4px}
.ba{display:flex;align-items:center;justify-content:center;gap:6px;margin:12px 0 8px}
.ba figure{margin:0;flex:1;min-width:0}.ba img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;background:#bfe6f6;display:block}
.ba figcaption{font-size:14px;color:var(--muted);margin-top:4px}.ba>span{font-size:26px;color:var(--accent)}
.lvd{font-size:15px;line-height:1.45;margin:6px 4px 4px}
.lvbox .go{font:inherit;font-size:20px;min-height:50px;width:100%;margin-top:8px;border:0;border-radius:18px;background:var(--accent);color:#fff;cursor:pointer}
.jfall{position:absolute;top:-30px;width:26px;height:26px;animation:fall linear forwards;will-change:transform}
.spark{position:fixed;width:22px;height:22px;z-index:6;pointer-events:none}
@keyframes fadein{from{opacity:0}}@keyframes pop{from{transform:scale(.5);opacity:0}}
#tp{position:fixed;right:max(10px,env(safe-area-inset-right));top:calc(max(14px,env(safe-area-inset-top)) + 70px);display:flex;flex-direction:column;gap:4px;z-index:5;background:rgba(255,255,255,.85);padding:6px;border-radius:14px;box-shadow:0 4px 12px rgba(59,53,80,.18)}
#tp small{font-size:11px;color:var(--muted);text-align:center}
#tpb{display:none}#tp.open #tpb{display:flex;flex-direction:column;gap:4px}.sheet.on~#tp{display:none}
#tp .tr{display:flex;flex-direction:column;gap:2px}#tp .tr>div{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
#tp button{font:inherit;font-size:12px;min-height:30px;min-width:32px;padding:0 6px;border:0;border-radius:10px;background:#f1eef7;color:var(--ink);cursor:pointer}
.toast{position:fixed;left:50%;top:92px;transform:translateX(-50%);background:#3b3550;color:#fff;border-radius:16px;padding:10px 18px;font-size:17px;display:none;max-width:90vw;text-align:center}
#tmB{position:fixed;right:max(12px,env(safe-area-inset-right));top:calc(max(14px,env(safe-area-inset-top)) + 64px);font:inherit;font-size:14px;min-height:34px;padding:0 12px;border:0;border-radius:12px;background:rgba(255,255,255,.88);color:var(--ink);box-shadow:0 4px 12px rgba(59,53,80,.18);cursor:pointer;z-index:6}
#tmB.on{background:#3b3550;color:#fff}
#tmW{position:fixed;right:max(12px,env(safe-area-inset-right));top:calc(max(14px,env(safe-area-inset-top)) + 104px);display:none;flex-wrap:wrap;gap:4px;width:150px;justify-content:flex-end;z-index:6}
#tmW.on{display:flex}#tmW button{font:inherit;font-size:13px;min-height:32px;min-width:44px;border:0;border-radius:10px;background:rgba(255,255,255,.9);color:var(--ink);box-shadow:0 2px 6px rgba(59,53,80,.18)}
.mtag{position:absolute;transform:translate(-50%,-100%);background:rgba(255,255,255,.93);color:#3b3550;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;box-shadow:0 2px 7px rgba(59,53,80,.2);pointer-events:none;white-space:nowrap}   /* 家長 11-20 00:05：市長標示不要紅底 */
.talk{position:absolute;transform:translate(-50%,-100%);width:max-content;background:#fff;border-radius:18px;padding:12px 18px;font-size:21px;color:var(--ink);box-shadow:0 6px 16px rgba(59,53,80,.28);max-width:min(78vw,380px);white-space:normal;pointer-events:none;line-height:2.05}   /* 家長 11-20 23:12：點小人說話的窗口放大（字 15→21） */
.talk b{display:block;font-size:15px;color:#7a6fa8;line-height:1.4;margin-bottom:2px}
.talk::after{content:'';position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:7px solid transparent;border-bottom:0;border-top-color:#fff}
#tmc{position:fixed;display:none;align-items:center;gap:6px;background:rgba(255,255,255,.96);border-radius:16px;padding:5px;box-shadow:0 4px 12px rgba(59,53,80,.25);z-index:6;transform:translate(0,-100%)}
#tmc.on{display:flex}
#tmc button{font:inherit;font-size:22px;width:42px;height:42px;border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer}
#tmc button:disabled{background:#d9d4e3}
#tmc b{font-size:16px;min-width:40px;text-align:center}
#tmc .x2{background:#f1eef7;color:var(--ink);font-size:15px}
@media (max-width:760px){ .hint{display:none} .pad{gap:6px;margin:4px auto} .pad button{min-height:38px;font-size:18px} .pwd{margin:4px 0} .sheet .why:empty{display:none} .chips button{min-height:34px;font-size:14px} .amt button{width:40px;height:40px;font-size:20px} .big{min-width:0;padding:0 14px;font-size:17px;min-height:46px} .sheet{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 62px);max-height:44vh} .dock{gap:8px} .stars{font-size:24px} .city b{font-size:18px} }
.sheet .go.soft,.row button.soft{background:#d9d4e3;color:#5f5a72}   /* 11-19：條件還沒做到的按鈕：灰色但可以點，點了跳提醒 */
.ndbox{text-align:left}.ndt{font-size:24px;font-weight:700;color:#c25a12;text-align:center;line-height:1.5}
.ndbig{display:block;width:120px;height:120px;object-fit:contain;margin:2px auto 0;filter:grayscale(.35)}
.ndsub{font-size:16px;color:var(--muted);margin:4px 0 2px}
.nd{display:flex;align-items:center;gap:8px;background:#fff4e6;border-radius:14px;padding:6px 8px;margin:6px 0;min-height:52px}

const hexes=[];

/* 家長 11-20 22:56：發電、污水、垃圾往南移一格 → 041、042、043 正南邊多三格（052、053、054），跟一般格子一樣排。
