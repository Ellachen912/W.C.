<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>市長的家｜精緻化比較</title><style>body{margin:0;background:#f5efe5;font:15px system-ui;color:#493e35}header{padding:12px;text-align:center}button,select{padding:10px;border:1px solid #c9b8a6;border-radius:9px;background:white;color:#493e35;font:inherit}button.active{background:#b46d50;color:white}canvas{display:block;touch-action:none}#view{height:72dvh}p{margin:8px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script><header><b>市長的家｜原版與精緻 V2.0</b><p><button id="old">原版</button> <button id="new" class="active">精緻版</button> <select id="level"><option value="1">第 1 級</option><option value="2">第 2 級</option><option value="3">第 3 級</option><option value="4">第 4 級</option><option value="5" selected>第 5 級</option></select></p><small>拖曳旋轉・雙指縮放・第5級大幅精緻化・相同鏡頭比較</small></header><div id="view"></div><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {setRoot,anims} from './lib.js';import {MAYOR as original} from './mayor.js';import {MAYOR as refined} from './mayor-detail-v2.js';
const view=document.querySelector('#view'),scene=new THREE.Scene();scene.background=new THREE.Color('#f5efe5');const camera=new THREE.PerspectiveCamera(35,1,.1,100);camera.position.set(8,6,10);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;view.append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1,0);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xfff6e5,0xa4b3c5,2));const sun=new THREE.DirectionalLight(0xfff3df,2.2);sun.position.set(5,9,6);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-7,right:7,top:7,bottom:-7});scene.add(sun);const base=new THREE.Mesh(new THREE.CylinderGeometry(3.65,3.65,.15,6),new THREE.MeshStandardMaterial({color:'#a7c68a'}));base.position.y=-.075;base.receiveShadow=true;scene.add(base);let root,mode=true;const level=document.querySelector('#level');function build(){if(root){scene.remove(root);root.traverse(o=>{if(o.geometry)o.geometry.dispose()})}anims.length=0;root=new THREE.Group();scene.add(root);setRoot(root);(mode?refined:original).levels[+level.value-1].fn();document.querySelector('#old').classList.toggle('active',!mode);document.querySelector('#new').classList.toggle('active',mode)}document.querySelector('#old').onclick=()=>{mode=false;build()};document.querySelector('#new').onclick=()=>{mode=true;build()};level.onchange=build;function resize(){renderer.setSize(view.clientWidth,view.clientHeight);camera.aspect=view.clientWidth/view.clientHeight;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();build();let last=0;renderer.setAnimationLoop(ms=>{const t=ms/1000;for(const f of anims)f(t,Math.min(.05,t-last));last=t;controls.update();renderer.render(scene,camera)});
</script></html>
