<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>恐龍公園與博物館 · 獨立測試</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang TC",sans-serif;color:#304f4d;background:#dcece4}
*{box-sizing:border-box}
body{margin:0}
main{height:100dvh;min-height:320px;position:relative;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
header,nav,#status{background:#fff8e9;box-shadow:0 6px 24px #34565124}
header{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));padding:.85rem 1rem;border-radius:16px;pointer-events:none}
h1{margin:0;font-size:clamp(19px,4vw,28px)}
p{margin:.35rem 0 0;font-size:14px;color:#4e6762}
nav{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:.42rem;padding:.37rem;border-radius:16px;white-space:nowrap}
button{font:inherit;font-size:14px;color:inherit;background:#fffdf6;border:1px solid #d3d8c9;border-radius:11px;padding:0 .8rem;min-height:44px;cursor:pointer}
button:focus-visible{outline:3px solid #4d8b79;outline-offset:2px}
#status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:12px;padding:.7rem .9rem;text-align:center}
a.credit{display:flex;align-items:center;margin:0 .35rem;color:#516962;font-size:12px}
[hidden]{display:none}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<main id="stage">
<canvas id="view" aria-label="低面數恐龍公園與博物館 3D 模型"></canvas>
<header><h1>恐龍公園與博物館</h1><p>獨立測試 · 拖曳旋轉、雙指縮放</p></header>
<p id="status" role="status">載入恐龍園區…</p>
<nav aria-label="3D 模型控制">
<button id="toggle" type="button" aria-pressed="true">暫停動畫</button>
<button id="reset" type="button">回到正面</button>
<a class="credit" href="https://quaternius.com/" target="_blank" rel="noopener">恐龍素材：Quaternius</a>
</nav>
</main>
<script type="module" src="./park.js?v=10"></script>
</body>
</html>
