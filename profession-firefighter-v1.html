<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Winston City 職業探索</title><style>body{margin:0;background:#f5f1e7;color:#34453d;font:17px system-ui}main{max-width:640px;margin:auto;padding:20px}section{background:white;border-radius:20px;padding:20px;margin:12px 0}button{font:inherit;color:inherit;background:#e7eee5;border:1px solid #c8d5c6;border-radius:12px;padding:12px;margin:5px 0;width:100%;text-align:left}button:disabled{opacity:.65}small{color:#65776b}#feedback{min-height:48px}h1{font-size:25px}h2{font-size:20px}</style><main><small>WINSTON CITY · 職業探索測試</small><h1>🚒 消防員的一天</h1><section><h2>消防隊員</h2><p>你好！我是消防員。我們不只救火，也會救援受困的人，並教大家如何預防火災。</p><button id="learn">認識我的工作</button><button id="tools">認識消防裝備</button><p id="info" aria-live="polite">選一個你想知道的問題吧！</p></section><section><small id="progress"></small><h2 id="question"></h2><div id="choices"></div><p id="feedback" aria-live="polite"></p><button id="next" hidden>下一題</button></section></main><script>const profession={id:'firefighter',workplace:'消防局',topics:{learn:'消防員會滅火、救援受困的人，也會檢查消防設備及宣導防火知識。',tools:'消防衣和頭盔能保護身體，空氣呼吸器能提供呼吸用的空氣，水帶可以輸送消防用水。'},questions:[{q:'發現火災時，應該怎麼做？',a:['躲在衣櫃裡','安全離開，請大人協助並打119','自己回去拿玩具'],correct:1,why:'先保護自己，離開危險區域，不要返回火場。台灣消防救護電話是119。'},{q:'消防員為什麼要戴頭盔？',a:['保護頭部','讓自己長高','用來裝水'],correct:0,why:'頭盔可以保護頭部，減少碰撞和掉落物造成的傷害。'},{q:'消防車出勤時，其他車輛應該怎麼做？',a:['跟著消防車','阻擋消防車','在安全情況下禮讓'],correct:2,why:'安全禮讓能幫助消防員更快抵達需要救援的地方。'}]};let i=0,done=false;const $=id=>document.getElementById(id);for(const k of ['learn','tools'])$(k).onclick=()=>{$('info').textContent=profession.topics[k]};function render(){done=false;$('next').hidden=true;$('feedback').textContent='';$('choices').replaceChildren();if(i===profession.questions.length){$('progress').textContent='探索完成';$('question').textContent='你完成了消防員知識挑戰！';$('next').textContent='再玩一次';$('next').hidden=false;return;}const q=profession.questions[i];$('progress').textContent='知識挑戰 '+(i+1)+' / '+profession.questions.length;$('question').textContent=q.q;q.a.forEach((a,j)=>{const b=document.createElement('button');b.textContent=a;b.onclick=()=>{if(done)return;if(j!==q.correct){$('feedback').textContent='再想想看，哪個做法最安全？';return;}done=true;$('feedback').textContent='答對了！'+q.why;for(const x of $('choices').children)x.disabled=true;$('next').hidden=false;};$('choices').append(b)});$('next').textContent='下一題';}$('next').onclick=()=>{i=i===profession.questions.length?0:i+1;render()};render();</script></html>
